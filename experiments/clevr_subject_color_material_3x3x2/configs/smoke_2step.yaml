schema_version: 1
status: pending_renderer_human_review
stage: train
run: {study: clevr_subject_color_material_3x3x2, variant: smoke2-material-pair, seed: 42}
environment: {CUDA_VISIBLE_DEVICES: "3"}
data_manifest: ${COLORPEEL_MATERIAL_MULTIVIEW_MANIFEST}
args:
  pretrained_model_name_or_path: CompVis/stable-diffusion-v1-4
  concepts_list: ${COLORPEEL_MATERIAL_SMOKE2_CONCEPTS}
  resolution: 512
  train_batch_size: 1
  learning_rate: 1.0e-5
  scale_lr: true
  lr_scheduler: constant
  lr_warmup_steps: 0
  max_train_steps: 2
  checkpointing_steps: 1000
  seed: 42
  mixed_precision: "no"
  cos_weight: 0.2
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  dataloader_num_workers: 2
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  hflip: true
  modifier_token: "<s1*>+<s2*>+<s3*>+<c1*>+<c2*>+<c3*>+<m1*>+<m2*>"
  initializer_token: "cube+sphere+cylinder+red+turquoise+gray+metal+rubber"
protocol:
  purpose: real_two_step_material_pair_smoke
  expected_exposure_counts: {"<s1*>": 2, "<s2*>": 0, "<s3*>": 0, "<c1*>": 2, "<c2*>": 0, "<c3*>": 0, "<m1*>": 1, "<m2*>": 1}
  expected_modifier_token_pairs:
    - ["<s1*>", "<c1*>", "<m1*>"]
    - ["<s1*>", "<c1*>", "<m2*>"]
  gt_masks_in_training: false
  caa_changed: false
  optimizer_changed: false
  non_modifier_embedding_update_policy: literal_official_adamw_decay_allowed
