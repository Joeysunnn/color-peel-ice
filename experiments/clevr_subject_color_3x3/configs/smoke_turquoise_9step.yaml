schema_version: 1
status: pending
stage: train
run:
  study: clevr_subject_color_3x3
  variant: smoke9-turquoise-full-grid
  seed: 42
environment:
  CUDA_VISIBLE_DEVICES: "3"
data_manifest: experiments/clevr_subject_color_3x3/manifests/clevr_3x3_manifest.json
args:
  pretrained_model_name_or_path: CompVis/stable-diffusion-v1-4
  concepts_list: ${COLORPEEL_CONCEPTS_LIST}
  resolution: 512
  train_batch_size: 1
  learning_rate: 1.0e-5
  scale_lr: true
  lr_scheduler: constant
  lr_warmup_steps: 0
  max_train_steps: 9
  checkpointing_steps: 1000
  seed: 42
  mixed_precision: "no"
  cos_weight: 0.2
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  dataloader_num_workers: 2
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  hflip: true
  modifier_token: "<s1*>+<s2*>+<s3*>+<c1*>+<c2*>+<c3*>"
  initializer_token: "cube+sphere+cylinder+red+turquoise+gray"
protocol:
  parent_variant: cyan_initializer_ablation
  scientific_change: cyan_initializer_only
  selected_candidate: turquoise
  selection_source: human_qualitative_review_2026-08-22
  purpose: real_nine_step_full_grid_training_smoke
  data_scope: all_nine_locked_samples_once
  expected_exposure_per_modifier_token: 3
  expected_modifier_token_pairs:
    - ["<s1*>", "<c1*>"]
    - ["<s1*>", "<c2*>"]
    - ["<s1*>", "<c3*>"]
    - ["<s2*>", "<c1*>"]
    - ["<s2*>", "<c2*>"]
    - ["<s2*>", "<c3*>"]
    - ["<s3*>", "<c1*>"]
    - ["<s3*>", "<c2*>"]
    - ["<s3*>", "<c3*>"]
  gt_masks_in_training: false
  caa_changed: false
  optimizer_changed: false
  training_mask_changed: false
  prompt_template_changed: false
  non_modifier_embedding_update_policy: literal_official_adamw_decay_allowed
observations:
  modifier_exposure_counts: required_exactly_three_each
  modifier_nonzero_gradient_steps: required_at_least_one_each
  modifier_embedding_delta_norms: required_nonzero_each
  ordinary_vocabulary_embedding_drift: record_only_not_failure
  restore_non_modifier_embeddings: false
