schema_version: 1
status: authorized_short_transfer
stage: train
run:
  study: natural_image_subject_color_pilot
  variant: emission_color_transfer_orange_short100
  seed: 42
environment:
  CUDA_VISIBLE_DEVICES: "3"
data_manifest: experiments/natural_image_subject_color_pilot/configs/d1_emission_color_transfer_orange_protocol_v1.json
args:
  pretrained_model_name_or_path: CompVis/stable-diffusion-v1-4
  concepts_list: ${COLORPEEL_EMISSION_TRANSFER_ORANGE_CONCEPTS}
  resolution: 512
  train_batch_size: 1
  learning_rate: 1.0e-5
  scale_lr: true
  lr_scheduler: constant
  lr_warmup_steps: 0
  max_train_steps: 100
  checkpointing_steps: 100
  seed: 42
  mixed_precision: "no"
  cos_weight: 0.2
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  dataloader_num_workers: 2
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.01
  adam_epsilon: 1.0e-8
  hflip: true
  modifier_token: "<C*>"
  initializer_token: "orange"
protocol:
  purpose: single_color_natural_noun_transfer_short_run
  source: d1_emission_color_transfer_orange_protocol_v1
  training_image_count: 9
  subject_modifier_tokens: false
  gt_masks_in_training: false
  full_dataset_expansion: forbidden
  transfer_generation: separate_authorization_after_training
observations:
  modifier_exposure_count: required_100
  modifier_nonzero_gradient_steps: required_at_least_one
  modifier_embedding_delta_norm: required_nonzero
  ordinary_vocabulary_embedding_drift: record_only_not_failure
