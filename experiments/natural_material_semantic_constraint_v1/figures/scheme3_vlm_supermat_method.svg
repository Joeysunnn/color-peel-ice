<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF4F7"/>
    </linearGradient>
    <linearGradient id="vlm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6F7F5"/>
      <stop offset="1" stop-color="#CDEEEA"/>
    </linearGradient>
    <linearGradient id="pbr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF4FF"/>
      <stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E8"/>
      <stop offset="1" stop-color="#FFE7BE"/>
    </linearGradient>
    <linearGradient id="canon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1ECFF"/>
      <stop offset="1" stop-color="#DFD4FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#294255" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#52697B"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#14877E"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#356FC1"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #173042; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #5B7080; }
      .step { font: 700 14px Arial, Helvetica, sans-serif; letter-spacing: 1.5px; fill: #FFFFFF; }
      .head { font: 700 23px Arial, Helvetica, sans-serif; fill: #193447; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #304B5D; }
      .small { font: 400 14px Arial, Helvetica, sans-serif; fill: #587080; }
      .mono { font: 600 17px Consolas, Menlo, monospace; fill: #213F52; }
      .tiny { font: 400 12px Arial, Helvetica, sans-serif; fill: #607482; }
      .white { fill: #FFFFFF; }
      .line { fill: none; stroke: #52697B; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #738796; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .tealLine { fill: none; stroke: #14877E; stroke-width: 4; marker-end: url(#arrowTeal); }
      .blueLine { fill: none; stroke: #356FC1; stroke-width: 4; marker-end: url(#arrowBlue); }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="url(#bg)"/>
  <text x="70" y="70" class="title">VLM-Constrained SuperMat Material Canonicalization</text>
  <text x="72" y="105" class="subtitle">Natural image → independent semantic and physical streams → constrained region selection → canonical material M*</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="60" y="170" rx="22" width="260" height="420" fill="#FFFFFF" stroke="#D8E3EA" stroke-width="2"/>
  </g>
  <rect x="60" y="170" rx="22" width="260" height="52" fill="#35556B"/>
  <text x="84" y="203" class="step">01 · INPUT</text>
  <text x="88" y="264" class="head">Natural image</text>
  <rect x="88" y="290" rx="15" width="204" height="154" fill="#EAEFF2"/>
  <!-- stylized mailbox -->
  <rect x="122" y="350" rx="34" width="136" height="62" fill="#E4512E"/>
  <path d="M122 381 C122 342 145 323 190 323 C235 323 258 342 258 381" fill="#F26A3E"/>
  <rect x="176" y="323" width="14" height="89" fill="#D64225" opacity="0.5"/>
  <rect x="121" y="412" width="16" height="18" rx="3" fill="#315066"/>
  <rect x="244" y="412" width="16" height="18" rx="3" fill="#315066"/>
  <path d="M115 316 L115 436" stroke="#C5D0D6" stroke-width="3"/>
  <text x="88" y="480" class="body">Target object +</text>
  <text x="88" y="507" class="body">material-region masks</text>
  <g transform="translate(90 530)">
    <rect width="94" height="32" rx="16" fill="#ECF2F5"/>
    <circle cx="17" cy="16" r="7" fill="#E4512E"/>
    <text x="31" y="21" class="small">RGB</text>
    <rect x="106" width="104" height="32" rx="16" fill="#ECF2F5"/>
    <circle cx="123" cy="16" r="7" fill="#11A7A0"/>
    <text x="138" y="21" class="small">Masks</text>
  </g>

  <!-- Split -->
  <path d="M320 365 L370 365 L370 284 L420 284" class="tealLine"/>
  <path d="M320 395 L370 395 L370 522 L420 522" class="blueLine"/>
  <circle cx="370" cy="380" r="9" fill="#52697B"/>
  <text x="339" y="355" class="tiny">independent</text>
  <text x="345" y="418" class="tiny">streams</text>

  <!-- VLM stream -->
  <g filter="url(#shadow)">
    <rect x="420" y="170" rx="22" width="390" height="230" fill="url(#vlm)" stroke="#A9DCD7" stroke-width="2"/>
  </g>
  <rect x="420" y="170" rx="22" width="390" height="52" fill="#16877E"/>
  <text x="446" y="203" class="step">02A · SEMANTIC STREAM</text>
  <text x="448" y="262" class="head">VLM semantic prior</text>
  <text x="448" y="298" class="body">Masked crop → Qwen3-VL</text>
  <g transform="translate(448 322)">
    <rect width="112" height="38" rx="19" fill="#FFFFFF" opacity="0.85"/>
    <text x="15" y="25" class="small">surface family</text>
    <rect x="124" width="80" height="38" rx="19" fill="#FFFFFF" opacity="0.85"/>
    <text x="142" y="25" class="small">gloss</text>
    <rect x="216" width="92" height="38" rx="19" fill="#FFFFFF" opacity="0.85"/>
    <text x="232" y="25" class="small">opacity</text>
  </g>
  <text x="448" y="387" class="small">Categorical labels only · no numeric PBR values</text>

  <!-- SuperMat stream -->
  <g filter="url(#shadow)">
    <rect x="420" y="430" rx="22" width="390" height="300" fill="url(#pbr)" stroke="#B5CCEF" stroke-width="2"/>
  </g>
  <rect x="420" y="430" rx="22" width="390" height="52" fill="#356FC1"/>
  <text x="446" y="463" class="step">02B · PHYSICAL STREAM</text>
  <text x="448" y="522" class="head">SuperMat PBR estimate</text>
  <text x="448" y="558" class="body">Whole-object RGBA → per-pixel maps</text>
  <g transform="translate(448 582)">
    <rect width="94" height="94" rx="12" fill="#CF553A"/>
    <path d="M0 72 C24 57 50 86 94 49 L94 94 L0 94Z" fill="#A53C2A" opacity="0.48"/>
    <text x="25" y="118" class="small">Albedo</text>
    <rect x="116" width="94" height="94" rx="12" fill="#888F93"/>
    <path d="M116 15 L210 78" stroke="#BFC4C6" stroke-width="22" opacity="0.45"/>
    <text x="121" y="118" class="small">Roughness</text>
    <rect x="232" width="94" height="94" rx="12" fill="#25292C"/>
    <circle cx="282" cy="43" r="22" fill="#DFE4E7" opacity="0.65"/>
    <text x="245" y="118" class="small">Metallic</text>
  </g>
  <text x="448" y="717" class="small">R/M maps provide all numerical material estimates</text>

  <!-- Merge arrows -->
  <path d="M810 284 L870 284 L870 350 L930 350" class="tealLine"/>
  <path d="M810 580 L870 580 L870 456 L930 456" class="blueLine"/>

  <!-- Gate -->
  <g filter="url(#shadow)">
    <rect x="930" y="170" rx="22" width="390" height="560" fill="url(#gate)" stroke="#EDC67E" stroke-width="2"/>
  </g>
  <rect x="930" y="170" rx="22" width="390" height="52" fill="#D88922"/>
  <text x="956" y="203" class="step">03 · SEMANTIC CONSTRAINT</text>
  <text x="958" y="260" class="head">Compatibility gate</text>
  <text x="958" y="294" class="body">Evaluate every candidate region</text>

  <g transform="translate(958 320)">
    <circle cx="12" cy="10" r="8" fill="#16877E"/>
    <text x="32" y="16" class="body">Family ↔ metallicity</text>
    <text x="32" y="43" class="small">painted/coated: M ≤ 0.15</text>
    <text x="32" y="66" class="small">bare metal: M ≥ 0.50</text>

    <circle cx="12" cy="102" r="8" fill="#16877E"/>
    <text x="32" y="108" class="body">Gloss ↔ roughness</text>
    <text x="32" y="135" class="small">semi-gloss: 0.20 ≤ R ≤ 0.65</text>
    <text x="32" y="158" class="small">glossy: R ≤ 0.45</text>

    <circle cx="12" cy="194" r="8" fill="#356FC1"/>
    <text x="32" y="200" class="body">Reliability checks</text>
    <text x="32" y="227" class="small">pixels ≥ 1000 · R-IQR ≤ 0.12</text>
    <text x="32" y="250" class="small">M-IQR ≤ 0.20</text>

    <circle cx="12" cy="286" r="8" fill="#8295A2"/>
    <text x="32" y="292" class="body">Opacity: record only</text>
    <text x="32" y="319" class="small">No transmission map is available</text>
  </g>

  <rect x="958" y="658" width="334" height="48" rx="12" fill="#FFF" stroke="#E55B4D" stroke-width="2"/>
  <text x="1125" y="688" text-anchor="middle" style="font:700 16px Arial; fill:#C54235">VLM never overwrites R or M</text>

  <!-- Canonicalization -->
  <path d="M1320 420 L1370 420" class="line"/>
  <g filter="url(#shadow)">
    <rect x="1370" y="170" rx="22" width="370" height="560" fill="url(#canon)" stroke="#C9B8F0" stroke-width="2"/>
  </g>
  <rect x="1370" y="170" rx="22" width="370" height="52" fill="#7554B3"/>
  <text x="1396" y="203" class="step">04 · CANONICALIZE</text>
  <text x="1398" y="262" class="head">Select + aggregate</text>
  <text x="1398" y="303" class="body">1. Reject incompatible regions</text>
  <text x="1398" y="337" class="body">2. Rank accepted regions by</text>
  <text x="1422" y="367" class="mono">IQR(R) + IQR(M)</text>
  <text x="1398" y="411" class="body">3. Robust aggregation</text>
  <text x="1422" y="449" class="mono">R* = median(R | mask)</text>
  <text x="1422" y="482" class="mono">M* = median(M | mask)</text>

  <rect x="1398" y="520" width="314" height="112" rx="18" fill="#FFFFFF" stroke="#A995D5" stroke-width="2"/>
  <text x="1555" y="557" text-anchor="middle" style="font:700 20px Arial; fill:#5F429B">Canonical material</text>
  <text x="1555" y="599" text-anchor="middle" style="font:700 28px Consolas; fill:#283F54">M* = {R*, M*}</text>
  <text x="1398" y="667" class="small">Semantic prior remains metadata.</text>
  <text x="1398" y="692" class="small">Albedo hue is excluded in this V1.</text>

  <!-- Round trip -->
  <path d="M1555 730 L1555 770 L1190 770 L1190 804" class="dashed"/>
  <g filter="url(#shadow)">
    <rect x="850" y="804" rx="20" width="690" height="178" fill="#FFFFFF" stroke="#CBD7DE" stroke-width="2"/>
  </g>
  <rect x="850" y="804" rx="20" width="220" height="178" fill="#F2F5F7"/>
  <text x="878" y="842" class="step" style="fill:#52697B">05 · DIAGNOSTIC</text>
  <text x="878" y="878" class="head">Round-trip check</text>
  <text x="878" y="910" class="small">Not RGB matching</text>
  <text x="878" y="934" class="small">Not physical ground truth</text>
  <text x="1104" y="850" class="body">M* → Cycles / Principled BSDF</text>
  <text x="1104" y="882" class="body">→ 3 lighting conditions → SuperMat</text>
  <text x="1104" y="922" class="mono">compare (R̂, M̂) with (R*, M*)</text>
  <text x="1104" y="954" class="small">Measures estimator–renderer consistency and lighting sensitivity</text>

  <!-- Example results -->
  <g filter="url(#shadow)">
    <rect x="60" y="780" rx="20" width="720" height="202" fill="#FFFFFF" stroke="#CBD7DE" stroke-width="2"/>
  </g>
  <text x="88" y="824" class="head">Example canonical outputs</text>
  <line x1="88" y1="850" x2="752" y2="850" stroke="#DCE5EA" stroke-width="2"/>
  <text x="92" y="880" class="small">SOURCE</text>
  <text x="255" y="880" class="small">VLM PRIOR</text>
  <text x="572" y="880" class="small">SUPERMAT M*</text>
  <line x1="88" y1="895" x2="752" y2="895" stroke="#E4EBEF"/>
  <circle cx="107" cy="924" r="11" fill="#E4512E"/>
  <text x="128" y="930" class="body">Mailbox</text>
  <text x="255" y="930" class="body">painted · semi-gloss</text>
  <text x="572" y="930" class="mono">R=.353  M=.039</text>
  <circle cx="107" cy="960" r="11" fill="#7B858A"/>
  <text x="128" y="966" class="body">Spoon</text>
  <text x="255" y="966" class="body">bare metal · glossy</text>
  <text x="572" y="966" class="mono">R=.247  M=.847</text>

  <!-- Legend -->
  <g transform="translate(1562 805)">
    <rect width="178" height="177" rx="18" fill="#F8FAFB" stroke="#D6E0E5"/>
    <text x="20" y="34" class="small" style="font-weight:700">INFORMATION FLOW</text>
    <line x1="22" y1="62" x2="70" y2="62" stroke="#14877E" stroke-width="5"/>
    <text x="82" y="68" class="small">semantic</text>
    <line x1="22" y1="96" x2="70" y2="96" stroke="#356FC1" stroke-width="5"/>
    <text x="82" y="102" class="small">numeric maps</text>
    <line x1="22" y1="130" x2="70" y2="130" stroke="#738796" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="82" y="136" class="small">diagnostic</text>
    <text x="20" y="163" class="tiny">Streams stay independent</text>
  </g>
</svg>
